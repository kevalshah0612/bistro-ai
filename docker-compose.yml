services:
  postgres:
    image: postgres:16-alpine
    container_name: intelligent-bistro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bistro
      POSTGRES_PASSWORD: bistro
      POSTGRES_DB: intelligent_bistro
    ports:
      - "5432:5432"
    volumes:
      - bistro-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bistro -d intelligent_bistro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bistro-postgres-data:
